<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      内容安全策略。
      两个必须放开的点：
      - connect-src 允许连到本地回环地址上的 Core 服务（端口是随机分配的，因此用通配）
      - style-src 允许内联样式，因为组件库会在运行时注入样式表
      其余全部收紧到 'self'，确保模型产出的内容不可能加载到外部脚本。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src http://127.0.0.1:* http://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EasyCode</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
